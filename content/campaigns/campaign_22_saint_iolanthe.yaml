id: campaign_22_saint_iolanthe
name: "The Feast of Saint Iolanthe"
region: region_ambrosian_reach
order: 22
threshold: 275
runs_ceiling: 14
world_type: shrine
position: { x: 65, y: 21.5 }
flavor_intro: >
  The feast of Saint Iolanthe lasts eleven days and during it no labour may be
  performed within sight of the Basilica, a prohibition that the Ecclesiarchy has
  ruled includes the digging of trenches. The invasion arrived in the second week of
  the preceding month, which gave the garrison twenty days to prepare and then took
  eleven of them away. Confessors walk the line each morning to confirm compliance.
  Officers have learned to site their positions just over the ridge, where the
  Basilica cannot see them, and the Ecclesiarchy has not yet decided whether this is
  piety or evasion.
win_summary: >
  The world holds and the feast was observed in full, which the Basilica has recorded
  as the two hundred and eleventh consecutive year of unbroken observance. Fighting
  during the eleven days took place beyond the ridge line and is therefore held not
  to have occurred within sight, a ruling issued three months after the fact by a
  confessor who was not there. Casualties across the feast came to just over nine
  thousand. The anniversary sermon thanked the Saint for her protection.
loss_summary: >
  The line beyond the ridge broke on the seventh day of the feast and the Basilica
  was entered on the ninth, still under prohibition, its defenders still working
  around it rather than in it. The Ecclesiarchy has ruled that the observance was
  completed, since no labour was performed. Refugee columns out of the Iolanthe
  precinct were routed through three neighbouring systems, none of which had been
  told they were coming. Two of them closed their ports.
